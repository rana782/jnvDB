services:
  - type: web
    name: jnv-api
    runtime: node
    plan: free
    region: oregon
    rootDir: jnv-platform
    buildCommand: npm run render-build
    startCommand: npm run start -w @jnv/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Data lives in Postgres (Excel import / CI). Server-side PDF extraction is off.
      - key: JNV_DISABLE_PDF_IMPORT
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Add in dashboard: https://your-app.vercel.app (no trailing slash)
      - key: CORS_ORIGIN
        sync: false
