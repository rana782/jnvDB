# Render Blueprint: API + free Postgres in one flow.
# https://render.com/docs/infrastructure-as-code
#
# You still must sign in to Render and click to create this from the repo.
# After the first deploy: set CORS_ORIGIN to your Vercel URL (Settings → Environment).

databases:
  - name: jnv-postgres
    databaseName: jnv_intel
    user: jnv
    plan: free

services:
  - type: web
    name: jnv-api
    runtime: node
    plan: free
    region: oregon
    rootDir: jnv-platform
    buildCommand: bash scripts/render-api-build.sh
    startCommand: npm run start -w @jnv/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jnv-postgres
          property: connectionString
      # Add in dashboard: https://your-app.vercel.app (no trailing slash)
      - key: CORS_ORIGIN
        sync: false
