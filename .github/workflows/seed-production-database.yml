# Manual only: seed regions/states/roles + founder user (argon2 hash) on production Postgres (e.g. Supabase).
#
# Repo → Settings → Secrets and variables → Actions — set:
#   Required:
#     - DATABASE_URL  OR  PRODUCTION_DATABASE_URL  (postgresql://…?sslmode=require)
#     - SEED_ADMIN_PASSWORD  (plain text; hashed in seed — never logged)
#   Optional:
#     - SEED_ADMIN_ROLLCODE  (login id; default founder if unset)
#     - SEED_FOUNDER_PASSWORD / SEED_FOUNDER_ROLLCODE  (legacy aliases for the same fields)
#
# Run: Actions → "Seed production database" → Run workflow → confirm = SEED

name: Seed production database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SEED to run (prevents mis-clicks)"
        required: true

jobs:
  seed:
    if: github.event.inputs.confirm == 'SEED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jnv-platform/package-lock.json

      - name: Install dependencies
        working-directory: jnv-platform
        run: npm ci --include=dev

      - name: Prisma generate
        working-directory: jnv-platform
        run: npm run db:generate -w @jnv/api

      - name: Run Prisma seed
        working-directory: jnv-platform/apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.PRODUCTION_DATABASE_URL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_ADMIN_ROLLCODE: ${{ secrets.SEED_ADMIN_ROLLCODE }}
          SEED_FOUNDER_PASSWORD: ${{ secrets.SEED_FOUNDER_PASSWORD }}
          SEED_FOUNDER_ROLLCODE: ${{ secrets.SEED_FOUNDER_ROLLCODE }}
        run: npx prisma db seed
